services:
  db:
    image: postgres:16-alpine
    container_name: triunfa_db
    environment:
      POSTGRES_USER: triunfa
      POSTGRES_PASSWORD: triunfa123
      POSTGRES_DB: triunfa_beca
    ports:
      - "5433:5432"   # 5433 en tu PC para no chocar con otro Postgres
    volumes:
      - triunfa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triunfa -d triunfa_beca"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: triunfa_api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: triunfa
      DB_PASSWORD: triunfa123
      DB_NAME: triunfa_beca
      JWT_SECRET: triunfa-beca-secreto-local
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  triunfa_data:
